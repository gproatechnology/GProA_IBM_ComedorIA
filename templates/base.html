<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Comedor IA IBM{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <h1>Sistema de Comedor IA</h1>
        <nav>
            <a href="{{ url_for('views.index') }}">Inicio</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('views.dashboard') }}">Dashboard</a>
                {% if current_user.role == 'admin' %}
                    <a href="{{ url_for('views.admin') }}">Admin</a>
                {% endif %}
                <a href="{{ url_for('auth.logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('views.login') }}">Login</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
