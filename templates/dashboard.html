{% extends "base.html" %}

{% block title %}Dashboard - Comedor IA{% endblock %}

{% block content %}
<h2>Dashboard de Empleado</h2>
<div id="menus">
    <h3>Menús Disponibles</h3>
    <div id="menu-list"></div>
</div>
<div id="orders">
    <h3>Mis Pedidos</h3>
    <div id="order-list"></div>
</div>
<script>
async function loadMenus() {
    const response = await fetch('/api/menu/');
    const menus = await response.json();
    const menuList = document.getElementById('menu-list');
    menuList.innerHTML = menus.map(menu => `
        <div class="menu-item">
            <h4>${menu.name}</h4>
            <p>${menu.description}</p>
            <p>Precio: $${menu.price}</p>
            <button onclick="orderMenu(${menu.id})">Pedir</button>
        </div>
    `).join('');
}

async function loadOrders() {
    const response = await fetch('/api/orders/');
    const orders = await response.json();
    const orderList = document.getElementById('order-list');
    orderList.innerHTML = orders.map(order => `
        <div class="order-item">
            <p>${order.menu_name} - Cantidad: ${order.quantity} - ${order.timestamp}</p>
        </div>
    `).join('');
}

async function orderMenu(menuId) {
    const response = await fetch('/api/orders/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ menu_id: menuId })
    });
    if (response.ok) {
        loadOrders();
    }
}

loadMenus();
loadOrders();
</script>
{% endblock %}
